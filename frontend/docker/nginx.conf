server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10m;
    }

    # APP-10: Dataset Copilot -- servicio Python aparte (`copilot`,
    # docker-compose.yml), no una ruta del backend Node, por eso su propio
    # location en vez de vivir bajo /api/ (ver frontend/src/lib/api/copilot.ts).
    #
    # Corrección de revisión (validación en vivo, APP-10): NO puede llamarse
    # /copilot/ -- esa es también la ruta de la SPA (React Router,
    # pages/dataset/Copilot.tsx). Visitar http://.../copilot directo (sin
    # /query) hacía que nginx respondiera su 301 automático de "agregar la
    # barra final" (falta trailing slash -> redirige a /copilot/), y ese
    # redirect usa la variable $host de nginx, que por diseño SIEMPRE quita
    # el puerto -- el navegador terminaba en http://localhost/copilot/ (puerto
    # 80, nada escuchando ahí) en vez de :8080, con "Unable to connect" sin
    # ninguna pista de por qué. Nombrar el proxy /copilot-api/ (en vez de
    # /copilot/) elimina la colisión de raíz: ya no hay ningún path que la
    # SPA necesite servir y que también matchee este location.
    location /copilot-api/ {
        proxy_pass http://copilot:8100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
