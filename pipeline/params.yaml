dataset_version: v1.0.0

m3:
  target_categories:
    - person
    - car

analyze:
  small_object_max_width: 32
  small_object_max_height: 32
  class_imbalance_min_images: 300
  spatial_grid_size: 3

split:
  train: 0.70
  val: 0.15
  test: 0.15
  seed: 42

# T3-1.2: proportions of the NEW leak-free manifest for the classifier crops.
# Independent from `split` above, which stays the inherited 70/15/15 image split.
classifier_split:
  train: 0.70
  val: 0.20
  test: 0.10
  seed: 42
